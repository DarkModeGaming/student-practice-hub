<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nebula Game Hub - Play</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  color:white;
  background:radial-gradient(circle at top,#172554,#020617 65%);
  min-height:100vh;
}
header{text-align:center;padding:25px 15px 10px}
h1{margin:0;font-size:34px}
header p{color:#cbd5e1}

nav{text-align:center;margin:10px}
nav a,button{
  border:0;
  border-radius:10px;
  padding:12px 18px;
  font-weight:bold;
  cursor:pointer;
  text-decoration:none;
}
nav a{background:#22d3ee;color:#06202a}

#games{
  max-width:1000px;
  margin:auto;
  padding:20px;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:18px;
}

.card{
  background:rgba(15,23,42,.92);
  border:1px solid #334155;
  border-radius:16px;
  padding:20px;
}
.card h2{margin-top:0}
.card p{color:#cbd5e1;min-height:45px}
.playBtn{background:#22d3ee;color:#06202a}

#gameScreen{
  display:none;
  max-width:950px;
  margin:auto;
  padding:20px;
}

.top{
  display:flex;
  gap:10px;
  align-items:center;
  flex-wrap:wrap;
  margin-bottom:15px;
}
.back{background:#e2e8f0;color:#0f172a}
.score{
  background:#0f172a;
  border:1px solid #334155;
  border-radius:10px;
  padding:11px 15px;
}

canvas{
  width:100%;
  height:auto;
  display:block;
  background:#020617;
  border:1px solid #334155;
  border-radius:14px;
}

#help{text-align:center;color:#cbd5e1;padding:12px}
</style>
</head>

<body>

<header>
  <h1>🚀 Nebula Game Hub</h1>
  <p>Play simple games directly on this page.</p>
</header>

<nav>
  <a href="index.html">🏠 Home</a>
</nav>

<section id="games">

  <div class="card">
    <h2>🏃 Nebula Runner</h2>
    <p>Jump over obstacles and survive.</p>
    <button class="playBtn" onclick="startGame('runner')">PLAY</button>
  </div>

  <div class="card">
    <h2>🧱 Brick Breaker</h2>
    <p>Break every brick with the paddle.</p>
    <button class="playBtn" onclick="startGame('brick')">PLAY</button>
  </div>

  <div class="card">
    <h2>🎯 Target Throw</h2>
    <p>Click the moving target for points.</p>
    <button class="playBtn" onclick="startGame('target')">PLAY</button>
  </div>

  <div class="card">
    <h2>🟢 Nebula Slope</h2>
    <p>Move left and right and avoid obstacles.</p>
    <button class="playBtn" onclick="startGame('slope')">PLAY</button>
  </div>

</section>

<section id="gameScreen">

  <div class="top">
    <button class="back" onclick="showGames()">← Games</button>
    <div class="score" id="score">Score: 0</div>
    <div class="score" id="status">Ready</div>
  </div>

  <canvas id="canvas" width="900" height="520"></canvas>

  <div id="help"></div>

</section>

<script>
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

let game="";
let score=0;
let raf=0;
let keys={};
let mouse={x:450,y:260};
let state={};

window.addEventListener("keydown",e=>{
  keys[e.key.toLowerCase()]=true;
  if(e.key===" ")e.preventDefault();
});

window.addEventListener("keyup",e=>{
  keys[e.key.toLowerCase()]=false;
});

canvas.addEventListener("pointermove",e=>{
  const r=canvas.getBoundingClientRect();
  mouse.x=(e.clientX-r.left)*canvas.width/r.width;
  mouse.y=(e.clientY-r.top)*canvas.height/r.height;
});

canvas.addEventListener("pointerdown",()=>{
  if(game==="target")hitTarget();
});

function startGame(type){
  cancelAnimationFrame(raf);

  game=type;
  score=0;

  document.getElementById("games").style.display="none";
  document.getElementById("gameScreen").style.display="block";

  if(type==="runner"){
    state={
      x:120,y:420,vy:0,t:0,
      obstacles:[],
      over:false
    };
    document.getElementById("help").textContent="Space or ↑ = Jump";
  }

  if(type==="brick"){
    state={
      paddle:450,
      ballX:450,
      ballY:430,
      dx:5,
      dy:-5,
      bricks:[],
      over:false
    };

    for(let r=0;r<5;r++){
      for(let c=0;c<10;c++){
        state.bricks.push({
          x:35+c*85,
          y:45+r*30,
          w:72,
          h:20,
          alive:true
        });
      }
    }

    document.getElementById("help").textContent="A/D or ←/→ = Move paddle";
  }

  if(type==="target"){
    state={
      x:700,
      y:250,
      r:45,
      t:0,
      time:30,
      over:false
    };

    document.getElementById("help").textContent="Click the target";
  }

  if(type==="slope"){
    state={
      x:0,
      t:0,
      obstacles:[],
      over:false
    };

    document.getElementById("help").textContent="A/D or ←/→ = Move";
  }

  document.getElementById("status").textContent="Playing";

  loop();
}

function showGames(){
  cancelAnimationFrame(raf);
  document.getElementById("games").style.display="grid";
  document.getElementById("gameScreen").style.display="none";
  game="";
}

function updateScore(){
  document.getElementById("score").textContent="Score: "+Math.floor(score);
}

function gameOver(text){
  state.over=true;
  document.getElementById("status").textContent=text;
}

function loop(){
  update();
  draw();
  if(!state.over)raf=requestAnimationFrame(loop);
}

function update(){

  if(state.over)return;

  if(game==="runner"){
    state.t++;

    state.vy+=0.9;
    state.y+=state.vy;

    if(state.y>420){
      state.y=420;
      state.vy=0;
    }

    if((keys.space||keys.arrowup)&&state.y===420){
      state.vy=-19;
      keys.space=false;
      keys.arrowup=false;
    }

    if(state.t%35===0){
      state.obstacles.push({
        x:900,
        w:30+Math.random()*25,
        h:35+Math.random()*55
      });
    }

    state.obstacles.forEach(o=>o.x-=10);

    state.obstacles=state.obstacles.filter(o=>o.x>-80);

    for(const o of state.obstacles){
      if(
        state.x+18>o.x &&
        state.x-18<o.x+o.w &&
        state.y>420-o.h+5
      ){
        gameOver("Game Over");
      }
    }

    score=state.t/8;
  }

  if(game==="brick"){

    if(keys.a||keys.arrowleft)state.paddle-=8;
    if(keys.d||keys.arrowright)state.paddle+=8;

    state.paddle=Math.max(55,Math.min(845,state.paddle));

    state.ballX+=state.dx;
    state.ballY+=state.dy;

    if(state.ballX<10||state.ballX>890)state.dx*=-1;
    if(state.ballY<10)state.dy*=-1;

    if(
      state.ballY>460 &&
      state.ballX>state.paddle-55 &&
      state.ballX<state.paddle+55
    ){
      state.dy=-Math.abs(state.dy);
    }

    if(state.ballY>530){
      gameOver("Game Over");
    }

    for(const b of state.bricks){
      if(
        b.alive &&
        state.ballX>b.x &&
        state.ballX<b.x+b.w &&
        state.ballY>b.y &&
        state.ballY<b.y+b.h
      ){
        b.alive=false;
        state.dy*=-1;
        score+=10;
        break;
      }
    }

    if(state.bricks.every(b=>!b.alive)){
      gameOver("You Win!");
    }
  }

  if(game==="target"){

    state.t++;

    state.time-=1/60;

    state.x=700+Math.sin(state.t/20)*220;
    state.y=260+Math.cos(state.t/27)*120;

    if(state.time<=0){
      gameOver("Time Up");
    }
  }

  if(game==="slope"){

    if(keys.a||keys.arrowleft)state.x-=7;
    if(keys.d||keys.arrowright)state.x+=7;

    state.x=Math.max(-350,Math.min(350,state.x));

    state.t++;
    score=state.t/5;

    state.obstacles.forEach(o=>o.y+=5);

    state.obstacles=state.obstacles.filter(o=>o.y<540);

    if(state.t%35===0){
      state.obstacles.push({
        x:100+Math.random()*700,
        y:-40,
        w:50+Math.random()*40,
        h:25+Math.random()*25
      });
    }

    const px=450+state.x;

    for(const o of state.obstacles){
      if(
        px+18>o.x &&
        px-18<o.x+o.w &&
        o.y+o.h>440 &&
        o.y<490
      ){
        gameOver("Crash!");
      }
    }
  }

  updateScore();
}

function hitTarget(){

  if(game!=="target"||state.over)return;

  const d=Math.hypot(
    mouse.x-state.x,
    mouse.y-state.y
  );

  if(d<=state.r){
    score+=10;
  }
}

function draw(){

  ctx.clearRect(0,0,900,520);

  ctx.fillStyle="#020617";
  ctx.fillRect(0,0,900,520);

  if(game==="runner")drawRunner();
  if(game==="brick")drawBrick();
  if(game==="target")drawTarget();
  if(game==="slope")drawSlope();
}

function drawRunner(){

  ctx.fillStyle="#172033";
  ctx.fillRect(0,440,900,80);

  ctx.fillStyle="#22d3ee";
  ctx.beginPath();
  ctx.arc(state.x,state.y-25,20,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle="#ef4444";

  for(const o of state.obstacles){
    ctx.fillRect(o.x,420-o.h,o.w,o.h);
  }
}

function drawBrick(){

  for(const b of state.bricks){
    if(b.alive){
      ctx.fillStyle="#22d3ee";
      ctx.fillRect(b.x,b.y,b.w,b.h);
    }
  }

  ctx.fillStyle="#e2e8f0";
  ctx.fillRect(
    state.paddle-55,
    480,
    110,
    14
  );

  ctx.fillStyle="#ffffff";
  ctx.beginPath();
  ctx.arc(state.ballX,state.ballY,9,0,Math.PI*2);
  ctx.fill();
}

function drawTarget(){

  ctx.beginPath();
  ctx.arc(state.x,state.y,state.r+12,0,Math.PI*2);
  ctx.fillStyle="#e11d48";
  ctx.fill();

  ctx.beginPath();
  ctx.arc(state.x,state.y,state.r,0,Math.PI*2);
  ctx.fillStyle="#ffffff";
  ctx.fill();

  ctx.beginPath();
  ctx.arc(state.x,state.y,state.r*.55,0,Math.PI*2);
  ctx.fillStyle="#e11d48";
  ctx.fill();

  ctx.beginPath();
  ctx.arc(state.x,state.y,state.r*.22,0,Math.PI*2);
  ctx.fillStyle="#ffffff";
  ctx.fill();

  ctx.fillStyle="#cbd5e1";
  ctx.font="18px Arial";
  ctx.fillText(
    "Time: "+Math.max(0,state.time).toFixed(1),
    20,30
  );
}

function drawSlope(){

  ctx.fillStyle="#07111f";
  ctx.fillRect(100,0,700,520);

  ctx.strokeStyle="#334155";
  ctx.lineWidth=2;

  for(let x=120;x<=780;x+=80){
    ctx.beginPath();
    ctx.moveTo(x,0);
    ctx.lineTo(x,520);
    ctx.stroke();
  }

  const px=450+state.x;

  ctx.fillStyle="#22d3ee";
  ctx.beginPath();
  ctx.arc(px,470,20,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle="#f59e0b";

  for(const o of state.obstacles){
    ctx.fillRect(o.x,o.y,o.w,o.h);
  }
}
</script>

</body>
</html>
